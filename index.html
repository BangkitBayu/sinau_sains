<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SinauSains | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div class="c container d-flex flex-column justify-content-center align-items-center min-vh-100">
            <div class="d-flex flex-column align-items-center shadow-lg p-4 rounded-3">
                <h1 class="h2">Login Siswa</h1>
                <p>Masuk untuk melanjutkan ke <span class="text-primary">SinauSains</span></p>
                <form class="mt-3">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" aria-describedby="username"
                            placeholder="Masukkan username kamu">
                        <span id="usernameError"></span>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control width-30ch" id="password"
                            placeholder="Masukkan password kamu">
                        <span id="passwordError"></span>
                        <!-- <div class="container mt-2 d-flex align-items-baseline gap-2 justify-content-start">
                            <input type="checkbox" name="checkbox" id="checkbox">
                            <p>Show password</p>
                        </div> -->
                    </div>
                    <button type="submit" class="btn btn-primary width-30ch">Submit</button>
                </form>
            </div>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="jquery.js"></script>
    <script>

        function saveNewUser(username, password) {
            const user = {
                "username": username,
                "password": password
            }

            return localStorage.setItem("user", JSON.stringify(user));
        }
        const submitButton = $("button[type='submit']");

        submitButton.click(e => {
            e.preventDefault();
            const username = $("#username").val().trim();
            const password = $("#password").val().trim();


            const usernameError = $("#usernameError");
            const passwordError = $("#passwordError");

            usernameError.text("").removeClass("text-danger")
            passwordError.text("").removeClass("text-danger")

            let error = false

            if (username.length < 3) {
                usernameError.text("Username harus lebih dari 3 karakter").addClass("text-danger");
                error = true
            }

            if (password.length < 8) {
                passwordError.text("Password harus lebih dari 8 karakter").addClass("text-danger");
                error = true
            }
            if (!error) {
                alert("Login berhasil!")
                saveNewUser(username, password)
                window.location.href = "dashboard.html"
            }
        })
    </script>

</body>

</html>
