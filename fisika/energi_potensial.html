<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Usaha dan Energi</title>
</head>

<body>
    <main>
        <div class="min-vh-100">
            <div class="container-fluid mt-4 p-3">
                <a href="../mapel/fisika.html" class="text-decoration-none text-dark underline-hover">&lt;&lt;
                    Kembali</a>
                <h3 class="h3 mt-4 text-center">Energi Potensial</h3>

                <div class="container-fluid mt-3">
                    <div class="input-group mb-3">
                        <input id="weight" type="text" class="form-control" placeholder="Masukkan massa benda"
                            aria-label="Recipient’s username" aria-describedby="basic-addon2">
                        <span class="input-group-text" id="basic-addon2">kg</span>
                    </div>
                    <div class="input-group mb-3">
                        <input id="gravity" type="text" class="form-control" placeholder="Masukkan gravitasi benda"
                            aria-label="Recipient’s username" aria-describedby="basic-addon3" value="10">
                        <span class="input-group-text" id="basic-addon3">m/s²</span>
                    </div>
                    <div class="input-group mb-3">
                        <input id="height" type="text" class="form-control" placeholder="Masukkan tinggi benda"
                            aria-label="Recipient’s username" aria-describedby="basic-addon3" style="width: 30ch;">
                        <span class="input-group-text" id="basic-addon4">m</span>
                    </div>

                    <button class="btn btn-primary" onclick="generateChart()" style="max-width: 25rem; width:100%;">Tampilkan
                        Grafik</button>
                </div>

                <div class="container mt-4">
                    <h3 class="h3 mt-4 text-center">Hasil Simulasi</h3>
                    <canvas id="epChart" width="400" height="200"></canvas>
                </div>

            </div>
        </div>
    </main>
    <footer class="text-center min-vh-20 mb-5">
        <div class="container-fluid d-flex justify-content-center align-items-center">
            <p>Copyright &copy; <span id="year"></span> SinauSains</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="jquery.js"></script>
    <script src="../scripts/energi_potensial.js"></script>
</body>

</html>
