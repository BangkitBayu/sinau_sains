<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [["\\(", "\\)"]],
                displayMath: [["\\[", "\\]"]]
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <title>Perpindahan Kalor</title>
</head>

<body>
    <main>
        <div class="min-vh-100">
            <div class="container mt-4 p-3">
                <a href="../mapel/fisika.html" class="text-decoration-none text-dark">&lt;&lt; Kembali</a>
                <div class="container">
                    <h3 class="h3 mt-4 text-center">Perpindahan Kalor</h3>
                    <p class="text-desc text-center">Perpindahan kalor adalah proses perpindahan energi panas dari benda
                        yang suhunya lebih tinggi ke benda yang suhunya lebih rendah. </p>
                </div>

                <div class="container-fluid mt-3 rounded-3 border border-2 p-3">
                    <h3>Rumus</h3>
                    <div id="rumusKalor" class="mt-3 fs-5"></div>
                </div>
                <div class="container-fluid mt-3 rounded-3 border border-2 p-3">
                    <div class="input-group mb-3">
                        <input id="massa" type="number" class="form-control" placeholder="Masukkan massa benda">
                        <span class="input-group-text">kg</span>
                    </div>

                    <div class="input-group mb-3">
                        <input id="kalor_jenis" type="number" class="form-control"
                            placeholder="Masukkan kalor jenis (c)">
                        <span class="input-group-text">J/kg°C</span>
                    </div>

                    <div class="input-group mb-3">
                        <input id="suhu_awal" type="number" class="form-control" placeholder="Masukkan suhu awal">
                        <span class="input-group-text">°C</span>
                    </div>

                    <div class="input-group mb-3">
                        <input id="suhu_akhir" type="number" class="form-control" placeholder="Masukkan suhu akhir">
                        <span class="input-group-text">°C</span>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" style="max-width: 50rem; width:100%;"
                            onclick="generateChart()">Hitung</button>
                        <button class="btn btn-danger" onclick="resetUI()"
                            style="max-width: 50rem; width:100%;">Reset</button>
                    </div>
                </div>

                <div class="container mt-4">
                    <h3 class="h3 text-center">Hasil Simulasi</h3>
                    <canvas id="kalorChart" width="400" height="400"></canvas>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center mb-5">
        <p>Copyright &copy; <span id="year"></span> SinauSains</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="jquery.js"></script>

    <script>

        function resetUI() {
            if (chart) chart.destroy();

            const input = document.querySelectorAll("input");

            input.forEach((i) => (i.value = ""));

            document.getElementById("rumusKalor").innerHTML = "";
        }

        function tampilkanRumus(m, c, T1, T2) {
            const latex = `
    \\[
        Q = m \\times c \\times (T_2 - T_1) \\\\
        Q = ${m} \\times ${c} \\times (${T2} - ${T1}) \\\\
        Q = ${m * c * (T2 - T1)}
    \\]
    `;

            return latex
        }


        document.getElementById("year").textContent = new Date().getFullYear();
        let chart; // untuk reset grafik jika digenerate ulang

        function generateChart() {
            const m = parseFloat(document.getElementById("massa").value);
            const c = parseFloat(document.getElementById("kalor_jenis").value);
            const T1 = parseFloat(document.getElementById("suhu_awal").value);
            const T2 = parseFloat(document.getElementById("suhu_akhir").value);

            const suhuList = [];
            const kalorList = [];

            for (let T = T1; T <= T2; T++) {
                const deltaT = T - T1;
                const Q = m * c * deltaT;

                suhuList.push(T);
                kalorList.push(Q);
            }

            const ctx = document.getElementById("kalorChart").getContext("2d");

            // reset grafik jika sudah ada
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: suhuList,
                    datasets: [{
                        label: "Kalor (Joule)",
                        data: kalorList,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: { text: "Suhu (°C)", display: true }
                        },
                        y: {
                            title: { text: "Kalor (J)", display: true }
                        }
                    }
                }
            });
            document.getElementById("rumusKalor").innerHTML = tampilkanRumus(m, c, T1, T2);
            MathJax.typesetPromise();
        }
    </script>

</body>

</html>
